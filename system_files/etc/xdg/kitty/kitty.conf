# Matte OS default Kitty look. Used until you create ~/.config/kitty/kitty.conf
# (start yours with: include /etc/xdg/kitty/kitty.conf).

font_family      JetBrains Mono
font_size        11.0

window_padding_width 10
hide_window_decorations yes
confirm_os_window_close 0
enable_audio_bell no

# Dark glass: near-black, light grey text, sky-blue only for the cursor and selection
background_opacity 0.92
background           #050608
foreground           #E6E9EF
cursor               #7DD3FC
cursor_text_color    #050608
selection_background #0E3A52
selection_foreground #E6E9EF
url_color            #7DD3FC

# Calm 16-colour palette (normal, then bright)
color0  #141821
color8  #3B4250
color1  #F87171
color9  #FCA5A5
color2  #86EFAC
color10 #BBF7D0
color3  #FBBF24
color11 #FDE68A
color4  #7DD3FC
color12 #BAE6FD
color5  #A5B4FC
color13 #C7D2FE
color6  #5EEAD4
color14 #99F6E4
color7  #C9CED8
color15 #E6E9EF
