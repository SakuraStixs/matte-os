# Matte OS login screen (Plasma Login Manager).
# Loaded after Bazzite's /usr/lib/plasmalogin/defaults.conf, so these win.
# Anything you set in System Settings > Login Screen goes to /etc/plasmalogin.conf and wins over this.

[Greeter]
WallpaperPluginId=org.kde.image
ShowClock=true

[Greeter][Wallpaper][org.kde.image][General]
Image=file:///usr/share/backgrounds/matte-os/matte-login.jpg
PreviewImage=file:///usr/share/backgrounds/matte-os/matte-login.jpg
FillMode=2
