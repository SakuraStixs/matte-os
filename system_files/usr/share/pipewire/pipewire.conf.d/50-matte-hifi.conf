# Matte OS: play music at its own sample rate instead of converting everything to 48 kHz.
# When the output device is idle, PipeWire switches it to the rate of the stream that starts
# (CD-quality 44.1 kHz, hi-res 96 or 192 kHz...). If two streams with different rates play at
# once, the second one is converted. Override in ~/.config/pipewire/pipewire.conf.d/ if needed.
context.properties = {
    default.clock.rate          = 48000
    default.clock.allowed-rates = [ 44100 48000 88200 96000 176400 192000 ]
}
